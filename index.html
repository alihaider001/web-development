<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>My First Website</title>
    <style>
      h1 {
        color: red;
      }
      h2 {
        color: gold;
        font-size: 30px;
      }
      /* CSS Rule */
      /* CSS selector */
      #my-unique-heading-2 {
        /* CSS declaration */
        /* property: value; */
        color: green;
        font-size: 40px;
        font-weight: lighter;
        font-style: italic;
      }

      #my-unique-heading-4 {
        font-style: italic;
      }

        color: blue;
      }

    <h1>Heading 1</h1>

      alt="Dog running in the park"
    />
    <h1>Heading</h1>

    <h2 class="my-heading">Heading 2 (2)</h2>
    <h2>Heading 2 (3)</h2>

      }

</html>
